<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<!--
  Sicherheitsrichtlinie: Die App lädt Code, Stile und Schriften ausschließlich
  aus diesem Repository. Netzwerkzugriffe sind nur zu den Kursquellen erlaubt.
  Trusted Types verhindern, dass jemals Text als HTML ins Dokument gelangt.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self' https://min-api.cryptocompare.com https://api.exchange.coinbase.com https://api.coingecko.com https://api.alternative.me https://mempool.space; base-uri 'none'; form-action 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types dca3-sw">
<meta name="referrer" content="no-referrer">
<title>BTC-Sparplan</title>
<meta name="description" content="Dein wöchentlicher Bitcoin-Sparplan – ruhig, ehrlich, schön.">
<meta name="theme-color" content="#090807">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sparplan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/mona-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/grund.css">
<link rel="stylesheet" href="css/teile.css">
<link rel="stylesheet" href="css/ansichten.css">
<link rel="stylesheet" href="css/bewegung-neu.css">
<script src="js/notfall.js" defer></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<!-- Atmosphäre: Nebel (WebGL, mit laufendem Korn), Glut – und ruhendes Filmkorn über allem -->
<div class="atmosphaere" aria-hidden="true">
  <div class="nebel" id="nebel"></div>
  <div class="glut" id="glut"></div>
</div>
<div class="korn" aria-hidden="true"></div>

<header class="kopf" id="kopf">
  <p class="kopf-links" id="kopf-links"></p>
  <div class="kopf-rechts">
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <button class="rund tippbar" id="knopf-einstellungen" type="button" aria-label="Einstellungen"></button>
  </div>
</header>

<main class="heute" id="heute">
  <div class="heute-inhalt" id="heute-inhalt"></div>
</main>

<noscript><p class="notfall">Diese App braucht JavaScript.</p></noscript>
</body>
</html>
